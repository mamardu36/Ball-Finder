<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" /><title>Ball Finder</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--ink:#0b0e17;--deep:#0e1420;--slate:#141c2e;--card:#1a2238;--border:rgba(255,255,255,0.07);--gold:#e8a830;--gold2:#c88820;--goldf:#f4c060;--blue:#3a7bd5;--blue2:#2860b8;--white:#eef2f8;--muted:#6a7a96;--ok:#28c96a;--warn:#e8a030;--danger:#e84040;}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}html,body{height:100%;font-family:'DM Sans',sans-serif;overflow:hidden;background:var(--ink);color:var(--white);}.screen{display:none;width:100%;height:100%;}.screen.active{display:flex;flex-direction:column;}#homeScreen{background:var(--deep);position:relative;overflow:hidden;justify-content:flex-end;}.atmo{position:absolute;inset:0;pointer-events:none;}.atmo-glow-gold{position:absolute;top:-8%;right:-12%;width:55vw;height:55vw;max-width:380px;max-height:380px;border-radius:50%;background:radial-gradient(circle,rgba(232,168,48,0.14) 0%,transparent 68%);}.atmo-glow-blue{position:absolute;top:20%;left:-18%;width:50vw;height:50vw;max-width:320px;max-height:320px;border-radius:50%;background:radial-gradient(circle,rgba(58,123,213,0.10) 0%,transparent 68%);}.atmo-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);background-size:42px 42px;}.horizon{position:absolute;top:44%;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(232,168,48,0.25) 35%,rgba(232,168,48,0.25) 65%,transparent);}.fairway-wrap{position:absolute;bottom:0;left:0;right:0;height:58%;}.fairway-wrap svg{position:absolute;bottom:0;left:0;width:100%;height:100%;}.hero-ball{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);z-index:3;}.ball-shadow{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);width:56px;height:10px;border-radius:50%;background:rgba(0,0,0,0.5);filter:blur(6px);animation:shadowPulse 3s ease-in-out infinite;}@keyframes shadowPulse{0%,100%{transform:translateX(-50%) scaleX(0.8);opacity:0.5;}50%{transform:translateX(-50%) scaleX(1.1);opacity:0.25;}}.ball-sphere{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#ffffff 0%,#e8eee8 48%,#c4d4c4 100%);box-shadow:0 0 0 1px rgba(255,255,255,0.3),0 0 28px rgba(232,168,48,0.30),0 12px 30px rgba(0,0,0,0.55);animation:ballFloat 3s ease-in-out infinite;position:relative;}.ball-sphere::after{content:'';position:absolute;inset:0;border-radius:50%;background-image:radial-gradient(circle,rgba(0,0,0,0.07) 1px,transparent 1px);background-size:9px 9px;background-position:4px 4px;}@keyframes ballFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}.scan-ring{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);width:128px;height:128px;z-index:2;}.scan-ring svg{width:100%;height:100%;animation:ringRotate 12s linear infinite;}@keyframes ringRotate{to{transform:rotate(360deg);}}.ring-inner{position:absolute;inset:18px;border-radius:50%;border:1px solid rgba(232,168,48,0.2);}.corner-marks{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);width:160px;height:160px;z-index:2;}.corner-marks::before,.corner-marks::after,.cm-b::before,.cm-b::after{content:'';position:absolute;width:14px;height:14px;border-color:rgba(232,168,48,0.6);border-style:solid;}.corner-marks::before{top:0;left:0;border-width:2px 0 0 2px;}.corner-marks::after{top:0;right:0;border-width:2px 2px 0 0;}.cm-b::before{bottom:0;left:0;border-width:0 0 2px 2px;}.cm-b::after{bottom:0;right:0;border-width:0 2px 2px 0;}.home-panel{position:relative;z-index:4;padding:30px 26px calc(env(safe-area-inset-bottom,0px) + 36px);display:flex;flex-direction:column;gap:22px;background:linear-gradient(0deg,var(--deep) 72%,transparent);}.eyebrow{display:flex;align-items:center;gap:10px;}.eyebrow-line{width:28px;height:2px;background:var(--gold);border-radius:2px;}.eyebrow-text{font-family:'Barlow Condensed',sans-serif;font-size:0.78rem;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);}.home-title{font-family:'Barlow Condensed',sans-serif;font-size:clamp(3.6rem,15vw,5.8rem);font-weight:800;line-height:0.88;letter-spacing:-0.01em;color:var(--white);}.home-title span{color:var(--gold);display:block;}.home-sub{font-size:0.92rem;color:var(--muted);line-height:1.6;max-width:32ch;}.stats-row{display:flex;gap:0;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:rgba(255,255,255,0.03);}.stat-item{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--border);}.stat-item:last-child{border-right:none;}.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:700;color:var(--white);letter-spacing:-0.02em;}.stat-label{font-size:0.72rem;color:var(--muted);font-weight:500;}.start-btn{appearance:none;border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:1.15rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;border-radius:16px;padding:20px 28px;color:var(--ink);background:linear-gradient(135deg,var(--goldf) 0%,var(--gold) 55%,var(--gold2) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.3),0 14px 28px rgba(200,136,32,0.35);display:flex;align-items:center;justify-content:center;gap:12px;transition:transform 0.13s,box-shadow 0.13s;}.start-btn:active{transform:scale(0.97);box-shadow:0 6px 12px rgba(200,136,32,0.2);}.home-panel>*{opacity:0;transform:translateY(16px);animation:riseUp 0.5s ease forwards;}.home-panel>*:nth-child(1){animation-delay:0.04s;}.home-panel>*:nth-child(2){animation-delay:0.10s;}.home-panel>*:nth-child(3){animation-delay:0.17s;}.home-panel>*:nth-child(4){animation-delay:0.24s;}.home-panel>*:nth-child(5){animation-delay:0.31s;}@keyframes riseUp{to{opacity:1;transform:none;}}#cameraScreen{position:fixed;inset:0;background:#000;overflow:hidden;}.viewer{position:absolute;inset:0;}canvas{width:100%;height:100%;display:block;background:#000;touch-action:none;object-fit:cover;}video{display:none;}.hud{position:absolute;inset:0;pointer-events:none;}.hud-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}.glass-pill{display:flex;align-items:center;gap:8px;padding:10px 15px;border-radius:14px;background:rgba(11,14,23,0.62);border:1px solid rgba(255,255,255,0.10);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);}.live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:blink 2s ease-in-out infinite;}@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.25;}}.hud-title{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:700;letter-spacing:0.12em;color:var(--white);}.zoom-badge{font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;font-weight:700;letter-spacing:0.06em;color:var(--gold);}.reticle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;opacity:0;transition:opacity 0.2s;}.reticle.active{opacity:1;}.ret-outer{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,0.88);box-shadow:0 0 20px rgba(255,255,255,0.2),inset 0 0 20px rgba(255,255,255,0.05);animation:retPop 0.3s ease forwards;}.ret-inner{position:absolute;inset:13px;border-radius:50%;border:1px solid rgba(232,168,48,0.7);}@keyframes retPop{0%{transform:scale(0.82);opacity:0;}70%{transform:scale(1.05);}100%{transform:scale(1);opacity:1;}}.scan-sweep{position:absolute;left:20%;right:20%;top:50%;height:2px;background:linear-gradient(90deg,transparent,rgba(232,168,48,0.9) 50%,transparent);box-shadow:0 0 10px rgba(232,168,48,0.5);opacity:0;}.scan-sweep.active{opacity:1;animation:sweep 0.65s ease-in-out forwards;}@keyframes sweep{0%{transform:translateY(-48px);opacity:0;}20%{opacity:1;}80%{opacity:1;}100%{transform:translateY(48px);opacity:0;}}.cam-bottom{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;gap:10px;pointer-events:none;}.cam-actions{display:flex;gap:10px;pointer-events:auto;}.btn-ghost{appearance:none;border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:15px 16px;font-family:'DM Sans',sans-serif;font-size:0.88rem;font-weight:600;cursor:pointer;color:rgba(255,255,255,0.75);background:rgba(11,14,23,0.60);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);white-space:nowrap;transition:background 0.13s;}.btn-ghost:active{background:rgba(30,40,60,0.80);}.btn-found{flex:1;appearance:none;border:none;border-radius:14px;padding:15px 20px;font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;cursor:pointer;color:var(--ink);background:linear-gradient(135deg,var(--goldf) 0%,var(--gold) 55%,var(--gold2) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.28),0 10px 22px rgba(200,136,32,0.40);transition:transform 0.12s;}.btn-found:active{transform:scale(0.97);}</style></head><body><section class="screen active" id="homeScreen"><div class="atmo"><div class="atmo-glow-gold"></div><div class="atmo-glow-blue"></div><div class="atmo-grid"></div><div class="horizon"></div></div><div class="fairway-wrap"><svg viewBox="0 0 390 360" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice"><defs><linearGradient id="rough" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#12281a"/><stop offset="100%" stop-color="#0a1610"/></linearGradient><linearGradient id="fairway" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e5c30"/><stop offset="100%" stop-color="#122018"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#267840"/><stop offset="100%" stop-color="#1a5028"/></linearGradient><radialGradient id="glow" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="rgba(232,168,48,0.10)"/><stop offset="100%" stop-color="transparent"/></radialGradient></defs><ellipse cx="195" cy="420" rx="340" ry="250" fill="url(#rough)"/><ellipse cx="195" cy="400" rx="200" ry="170" fill="url(#fairway)"/><ellipse cx="195" cy="380" rx="120" ry="100" fill="url(#green)"/><ellipse cx="195" cy="360" rx="340" ry="250" fill="url(#glow)"/><g opacity="0.06" stroke="#fff" stroke-width="1"><line x1="50"  y1="280" x2="340" y2="296"/><line x1="50"  y1="304" x2="340" y2="320"/><line x1="50"  y1="328" x2="340" y2="344"/><line x1="110" y1="260" x2="116" y2="380"/><line x1="152" y1="258" x2="158" y2="380"/><line x1="194" y1="256" x2="200" y2="380"/><line x1="236" y1="258" x2="242" y2="380"/><line x1="276" y1="262" x2="282" y2="380"/></g><line x1="194" y1="270" x2="194" y2="320" stroke="rgba(255,255,255,0.6)" stroke-width="1.8"/><polygon points="194,270 220,280 194,290" fill="#e8a830" opacity="0.9"/><ellipse cx="194" cy="321" rx="6" ry="2.2" fill="rgba(0,0,0,0.4)"/><circle cx="255" cy="302" r="5.5" fill="#fff" opacity="0.55"/><circle cx="144" cy="294" r="4"   fill="#fff" opacity="0.35"/><circle cx="218" cy="328" r="3.5" fill="#fff" opacity="0.28"/></svg></div><div class="scan-ring"><div class="ring-inner"></div><svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="64" cy="64" r="58" stroke="rgba(232,168,48,0.35)" stroke-width="1.5" stroke-dasharray="6 4"/><circle cx="64" cy="64" r="46" stroke="rgba(255,255,255,0.10)" stroke-width="1"/></svg></div><div class="corner-marks"><div class="cm-b"></div></div><div class="hero-ball"><div class="ball-sphere"></div><div class="ball-shadow"></div></div><div class="home-panel"><div class="eyebrow"><div class="eyebrow-line"></div><div class="eyebrow-text">Golf Vision · Détection terrain</div></div><h1 class="home-title">BALL<span>FINDER</span></h1><p class="home-sub">Repérez votre balle dans l'herbe en quelques secondes grâce à la détection visuelle intelligente.</p><button class="start-btn" id="startExperienceBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12a7 7 0 1 0 14 0A7 7 0 0 0 5 12Z" stroke="#0b0e17" stroke-width="1.8"/><path d="M10.5 9.5l4 2.5-4 2.5V9.5Z" fill="#0b0e17"/></svg>Lancer la recherche</button></div></section><section class="screen" id="cameraScreen"><div class="viewer"><canvas id="canvas"></canvas><video id="video" playsinline autoplay muted></video><div class="hud"><div class="hud-top"><div class="glass-pill"><div class="live-dot"></div><div class="hud-title">BALL FINDER</div></div><div class="glass-pill"><div class="zoom-badge" id="zoomPill">× 1.0</div></div></div><div class="reticle" id="focusRing"><div class="ret-outer"></div><div class="ret-inner"></div></div><div class="scan-sweep" id="scanLine"></div></div><div class="cam-bottom"><div class="cam-actions"><button class="btn-ghost" id="zoomOutBtn">↙ Dézoomer</button><button class="btn-found" id="ballFoundBtn">✓ Balle trouvée</button></div></div></div></section><script>
const homeScreen   = document.getElementById("homeScreen");
const cameraScreen = document.getElementById("cameraScreen");
const video        = document.getElementById("video");
const canvas       = document.getElementById("canvas");
const ctx          = canvas.getContext("2d", { willReadFrequently: true });
const zoomPill     = document.getElementById("zoomPill");
const focusRing    = document.getElementById("focusRing");
const scanLine     = document.getElementById("scanLine");
let stream = null, videoTrack = null, rafId = null, frameCounter = 0;
let latestRawFrame = null, latestDetectedCandidates = [];
let exclusionZones = [], inspectionState = null, pinchState = null;
let zoomState = { scale: 1, targetScale: 1, centerX: .5, centerY: .5 };
let cameraZoomSupport = null, pendingStrictAnalysis = null;
let tracks = [];
let nextTrackId = 1;
const PROCESS_SCALE = .52;
const MIN_ZOOM = 1, MAX_ZOOM = 3.2, STRICT_ANALYSIS_DELAY_MS = 220;
const MAX_EXCLUSIONS = 40;
const RENDER_MAX_DIMENSION = 1080;
const DISPLAY_INTERVAL_MS = 1000 / 24;
const ANALYSIS_INTERVAL_MS = 125;
const CALIBRATION_INTERVAL_MS = 1200;
const ANALYSIS_SCALES = [0.46, 0.62, 0.80];
const SHOW_THRESHOLD = 0.60;
const TRACK_DECAY = 0.06;
const TRACK_GAIN = 0.18;
const TRACK_MAX_MISSED = 14;
const rawCanvas = document.createElement("canvas");
const rawCtx = rawCanvas.getContext("2d", { willReadFrequently: true });
const scaledCanvas = document.createElement("canvas");
const scaledCtx = scaledCanvas.getContext("2d", { willReadFrequently: true });
const cropCanvas = document.createElement("canvas");
const cropCtx = cropCanvas.getContext("2d", { willReadFrequently: true });
const DEFAULT_TERRAIN_CENTROIDS = [
{ rn: 0.24, gn: 0.52, bn: 0.24, lum: 90,  sat: 0.54, weight: 1 },
{ rn: 0.40, gn: 0.42, bn: 0.18, lum: 132, sat: 0.42, weight: 1 },
{ rn: 0.46, gn: 0.35, bn: 0.19, lum: 96,  sat: 0.45, weight: 1 }
];
function createDefaultTerrainModel() {
return {
ready: false,
sceneLum: 105,
sceneConfidence: 0.12,
vegetationRatio: 0,
texturedRatio: 0,
centroids: DEFAULT_TERRAIN_CENTROIDS.map(centroid => ({ ...centroid }))
};
}
let terrainModel = createDefaultTerrainModel();
let terrainLut = new Uint8Array(4096);
let latestVegetationMask = null;
const ballTarget = {
mode: "white"
};
let lastDisplayTime = 0;
let lastAnalysisTime = 0;
let lastCalibrationTime = 0;
let analysisScaleIndex = 0;
function setStatus() {}
function setHint() {}
function showScreen(n) {
homeScreen.classList.toggle("active", n === "home");
cameraScreen.classList.toggle("active", n === "camera");
}
function clamp(v) { return v < 0 ? 0 : v > 255 ? 255 : v; }
function setCanvasSize(target, width, height) {
if (target.width !== width || target.height !== height) {
target.width = width;
target.height = height;
}
}
function getRenderDimensions(videoWidth, videoHeight) {
const longestSide = Math.max(videoWidth, videoHeight);
const scale = Math.min(1, RENDER_MAX_DIMENSION / longestSide);
return {
width: Math.max(2, Math.round(videoWidth * scale)),
height: Math.max(2, Math.round(videoHeight * scale))
};
}
function updateZoomUi() {
zoomPill.textContent = `× ${zoomState.scale.toFixed(1)}`;
}
function pulseScan() {
focusRing.classList.remove("active");
scanLine.classList.remove("active");
void focusRing.offsetWidth;
focusRing.classList.add("active");
scanLine.classList.add("active");
setTimeout(() => {
focusRing.classList.remove("active");
scanLine.classList.remove("active");
}, 760);
}
function rgbToHsv(r, g, b) {
r /= 255; g /= 255; b /= 255;
const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
let h = 0;
const s = mx === 0 ? 0 : d / mx, v = mx;
if (d) {
switch (mx) {
case r: h = ((g - b) / d) % 6; break;
case g: h = (b - r) / d + 2; break;
case b: h = (r - g) / d + 4; break;
}
h *= 60;
if (h < 0) h += 360;
}
return { h, s, v };
}
function luminance(r, g, b) {
return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function chroma(r, g, b) {
return Math.max(r, g, b) - Math.min(r, g, b);
}
function clamp01(value) {
return Math.max(0, Math.min(1, value));
}
function getColorFeatures(r, g, b) {
const sum = Math.max(1, r + g + b);
const hsv = rgbToHsv(r, g, b);
return {
rn: r / sum,
gn: g / sum,
bn: b / sum,
lum: luminance(r, g, b),
sat: hsv.s,
hue: hsv.h,
value: hsv.v
};
}
function featureDistance(a, b) {
const dr = a.rn - b.rn;
const dg = a.gn - b.gn;
const db = a.bn - b.bn;
const ds = a.sat - b.sat;
const dl = (a.lum - b.lum) / 255;
return Math.sqrt(
dr * dr +
dg * dg +
db * db
) * 3.35 +
Math.abs(ds) * 0.42 +
Math.abs(dl) * 0.22;
}
function vegetationColorPrior(feature) {
const hue = feature.hue;
const saturation = feature.sat;
const value = feature.value;
if (
feature.lum < 14 ||
feature.lum > 228 ||
value < 0.07 ||
value > 0.96
) {
return 0;
}
let greenPrior = 0;
let dryPrior = 0;
let brownPrior = 0;
if (
hue >= 50 &&
hue <= 178 &&
saturation >= 0.10
) {
const saturationScore = clamp01(
(saturation - 0.10) / 0.48
);
const hueScore = clamp01(
1 - Math.abs(hue - 108) / 92
);
greenPrior =
0.38 +
0.34 * saturationScore +
0.28 * hueScore;
}
if (
hue >= 31 &&
hue <= 76 &&
saturation >= 0.14 &&
value <= 0.94
) {
const saturationScore = clamp01(
(saturation - 0.14) / 0.48
);
const hueScore = clamp01(
1 - Math.abs(hue - 50) / 30
);
dryPrior =
0.28 +
0.30 * saturationScore +
0.24 * hueScore;
}
if (
hue >= 18 &&
hue < 38 &&
saturation >= 0.24 &&
value <= 0.82
) {
const saturationScore = clamp01(
(saturation - 0.24) / 0.52
);
const hueScore = clamp01(
1 - Math.abs(hue - 29) / 14
);
brownPrior =
0.06 +
0.12 * saturationScore +
0.10 * hueScore;
}
return clamp01(
Math.max(
greenPrior,
dryPrior,
brownPrior
)
);
}
function isBroadSeasonalTerrainColor(feature) {
return vegetationColorPrior(feature) >= 0.28;
}
function terrainAffinityRaw(r, g, b) {
const maximum = Math.max(r, g, b);
const minimum = Math.min(r, g, b);
const currentChroma = maximum - minimum;
const feature = getColorFeatures(r, g, b);
if (
feature.lum < 10 ||
feature.lum > 236 ||
(
maximum > 174 &&
currentChroma < 40
)
) {
return 0;
}
const botanicalPrior = vegetationColorPrior(feature);
if (botanicalPrior < 0.08) {
return 0;
}
let bestAffinity = 0;
for (const centroid of terrainModel.centroids) {
const distance = featureDistance(
feature,
centroid
);
const affinity = clamp01(
1 - distance / 0.50
);
if (affinity > bestAffinity) {
bestAffinity = affinity;
}
}
const learnedAffinity =
bestAffinity *
(
0.22 +
0.78 * botanicalPrior
);
const fallbackAffinity =
botanicalPrior * 0.52;
const sceneGate =
0.06 +
0.94 * terrainModel.sceneConfidence;
return clamp01(
Math.max(
learnedAffinity,
fallbackAffinity
) * sceneGate
);
}
function buildTerrainLut() {
const lut = new Uint8Array(4096);
for (let ri = 0; ri < 16; ri++) {
for (let gi = 0; gi < 16; gi++) {
for (let bi = 0; bi < 16; bi++) {
const r = ri * 16 + 8;
const g = gi * 16 + 8;
const b = bi * 16 + 8;
const index =
(ri << 8) |
(gi << 4) |
bi;
lut[index] = Math.round(
terrainAffinityRaw(r, g, b) * 255
);
}
}
}
terrainLut = lut;
}
function terrainAffinityFast(r, g, b) {
const index =
((r >> 4) << 8) |
((g >> 4) << 4) |
(b >> 4);
return terrainLut[index] / 255;
}
function chooseInitialCentroids(samples, count = 3) {
if (!samples.length) {
return [];
}
const centroids = [];
let first = samples[0];

if (rafId) cancelAnimationFrame(rafId);
rafId = requestAnimationFrame(processFrame);
} catch (err) {
console.error("Impossible de démarrer la caméra :", err);
stopCamera();
showScreen("home");
}
}
function stopCamera() {
if (pendingStrictAnalysis) {
clearTimeout(pendingStrictAnalysis);
pendingStrictAnalysis = null;
}
if (rafId) {
cancelAnimationFrame(rafId);
rafId = null;
}
if (stream) {
stream.getTracks().forEach(t => t.stop());
stream = null;
}
video.srcObject = null;
videoTrack = null;
cameraZoomSupport = null;
latestRawFrame = null;
latestDetectedCandidates = [];
frameCounter = 0;
lastDisplayTime = 0;
lastAnalysisTime = 0;
lastCalibrationTime = 0;
analysisScaleIndex = 0;
inspectionState = null;
tracks = [];
exclusionZones = [];
terrainModel = createDefaultTerrainModel();
latestVegetationMask = null;
buildTerrainLut();
zoomState = { scale: 1, targetScale: 1, centerX: .5, centerY: .5 };
updateZoomUi();
}
async function resetZoom() {
zoomState.targetScale = 1;
if (cameraZoomSupport?.usingNativeZoom) await applyNativeZoom();
}
buildTerrainLut();
document.getElementById("startExperienceBtn").addEventListener("click", async () => {
showScreen("camera");
await startCamera();
});
document.getElementById("ballFoundBtn").addEventListener("click", () => {
stopCamera();
showScreen("home");
});
document.getElementById("zoomOutBtn").addEventListener("click", resetZoom);
canvas.addEventListener("pointerdown", handlePointerDown);
canvas.addEventListener("pointermove", handlePointerMove);
canvas.addEventListener("pointerup", handlePointerUp);
canvas.addEventListener("pointercancel", handlePointerUp);
window.addEventListener("beforeunload", stopCamera);
updateZoomUi();
</script></body></html>
